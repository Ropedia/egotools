# Paper dataset: https://huggingface.co/datasets/ropedia-ai/egotools-data
# The public repository holds recording assets under raw/ and the final 184,679-row
# SFT export with media under sft/ (media paths relative to sft/, see
# docs/TRAINING.md#final-training-data). The benchmark question table needs a
# separate mapping. Override with --repo-id/--subdir.
# Historical bundles are explicitly configured in resources.preview.yaml.
benchmark:
  repo_id: ""
  repo_type: dataset
  subdir: null
  paper_rows: 1000
  status: pending

